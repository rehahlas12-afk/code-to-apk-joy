name: Build Android APK

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Setup Java (JDK 21)
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Install npm dependencies
        run: npm install --legacy-peer-deps

      - name: Build web assets (Vite)
        run: |
          npm run build
          rm -f dist/tessdata/fra.traineddata


      - name: Add Android platform (if missing)
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi

      - name: Generate Android launcher icons & splash from resources/icon.png
        run: |
          if [ -f "resources/icon.png" ]; then
            npx --yes @capacitor/assets generate --android \
              --iconBackgroundColor "#000000" \
              --iconBackgroundColorDark "#000000" \
              --splashBackgroundColor "#000000" \
              --splashBackgroundColorDark "#000000" || echo "Asset generation failed (non-fatal)"
          else
            echo "No resources/icon.png found, skipping icon generation"
          fi

      - name: Sync Capacitor (Android)
        run: npx cap sync android

      - name: Inject Android permissions (camera, micro, etc.)
        run: |
          MANIFEST=android/app/src/main/AndroidManifest.xml
          python3 - <<'PY'
          import re, pathlib
          p = pathlib.Path("android/app/src/main/AndroidManifest.xml")
          s = p.read_text()
          perms = [
              'android.permission.INTERNET',
              'android.permission.CAMERA',
              'android.permission.RECORD_AUDIO',
              'android.permission.MODIFY_AUDIO_SETTINGS',
              'android.permission.ACCESS_NETWORK_STATE',
              'android.permission.WRITE_EXTERNAL_STORAGE',
              'android.permission.READ_EXTERNAL_STORAGE',
              'android.permission.READ_MEDIA_IMAGES',
              'android.permission.POST_NOTIFICATIONS',
              'android.permission.VIBRATE',
          ]
          features = [
              ('android.hardware.camera', 'false'),
              ('android.hardware.camera.autofocus', 'false'),
              ('android.hardware.microphone', 'false'),
          ]
          block = ""
          for perm in perms:
              tag = f'<uses-permission android:name="{perm}" />'
              if perm not in s:
                  block += "    " + tag + "\n"
          for feat, req in features:
              tag = f'<uses-feature android:name="{feat}" android:required="{req}" />'
              if feat not in s:
                  block += "    " + tag + "\n"
          if block:
              s = re.sub(r'(<manifest[^>]*>\s*\n)', r'\1' + block, s, count=1)
              p.write_text(s)
              print("Injected permissions:\n" + block)
          else:
              print("All permissions already present")
          PY
          echo "--- Final AndroidManifest.xml ---"
          cat $MANIFEST

      - name: Grant execute permission to gradlew
        run: chmod +x android/gradlew

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Create GitHub Release (on main push)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: APK Build ${{ github.run_number }}
          files: android/app/build/outputs/apk/debug/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
