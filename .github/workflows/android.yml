name: Build Android APK

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Setup Java (JDK 21)
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Install npm dependencies
        run: npm install --legacy-peer-deps

      - name: Build web assets (Vite)
        env:
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
        run: |
          npm run build
          rm -f dist/tessdata/fra.traineddata



      - name: Add Android platform (if missing)
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi

      - name: Add native Downloads saver for PDFs and plans
        run: |
          mkdir -p android/app/src/main/java/com/sabrinos/app
          cat > android/app/src/main/java/com/sabrinos/app/DownloadSaverPlugin.java <<'JAVA'
          package com.sabrinos.app;

          import android.app.Activity;
          import android.content.ClipData;
          import android.content.ContentResolver;
          import android.content.ContentValues;
          import android.content.Intent;
          import android.net.Uri;
          import android.os.Build;
          import android.os.Environment;
          import android.provider.MediaStore;
          import android.util.Base64;
          import androidx.activity.result.ActivityResult;
          import androidx.core.content.FileProvider;
          import com.getcapacitor.JSObject;
          import com.getcapacitor.Plugin;
          import com.getcapacitor.PluginCall;
          import com.getcapacitor.PluginMethod;
          import com.getcapacitor.annotation.ActivityCallback;
          import com.getcapacitor.annotation.CapacitorPlugin;
          import java.io.ByteArrayOutputStream;
          import java.io.File;
          import java.io.FileOutputStream;
          import java.io.InputStream;
          import java.io.OutputStream;

          @CapacitorPlugin(name = "DownloadSaver")
          public class DownloadSaverPlugin extends Plugin {
              private static final String APP_FOLDER = "STAF-Transport";

              @PluginMethod
              public void saveBase64(PluginCall call) {
                  String fileName = call.getString("fileName", "staf-fichier.pdf");
                  String data = call.getString("data", "");
                  String mimeType = call.getString("mimeType", "application/octet-stream");
                  try {
                      byte[] bytes = Base64.decode(data, Base64.DEFAULT);
                      JSObject ret = new JSObject();
                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.Q) {
                          ContentResolver resolver = getContext().getContentResolver();
                          ContentValues values = new ContentValues();
                          values.put(MediaStore.MediaColumns.DISPLAY_NAME, fileName);
                          values.put(MediaStore.MediaColumns.MIME_TYPE, mimeType);
                          values.put(MediaStore.MediaColumns.RELATIVE_PATH, Environment.DIRECTORY_DOWNLOADS + "/" + APP_FOLDER);
                          values.put(MediaStore.MediaColumns.IS_PENDING, 1);
                          Uri uri = resolver.insert(MediaStore.Downloads.EXTERNAL_CONTENT_URI, values);
                          if (uri == null) throw new Exception("Téléchargement indisponible");
                          try (OutputStream out = resolver.openOutputStream(uri)) {
                              if (out == null) throw new Exception("Fichier impossible à ouvrir");
                              out.write(bytes);
                          }
                          values.clear();
                          values.put(MediaStore.MediaColumns.IS_PENDING, 0);
                          resolver.update(uri, values, null, null);
                          ret.put("uri", uri.toString());
                      } else {
                          File dir = new File(Environment.getExternalStoragePublicDirectory(Environment.DIRECTORY_DOWNLOADS), APP_FOLDER);
                          if (!dir.exists() && !dir.mkdirs()) throw new Exception("Dossier Téléchargements inaccessible");
                          File file = new File(dir, fileName);
                          try (FileOutputStream out = new FileOutputStream(file)) { out.write(bytes); }
                          Uri uri = FileProvider.getUriForFile(getActivity(), getContext().getPackageName() + ".fileprovider", file);
                          ret.put("uri", uri.toString());
                      }
                      ret.put("path", "Téléchargements/" + APP_FOLDER + "/" + fileName);
                      call.resolve(ret);
                  } catch (Exception e) {
                      call.reject(e.getMessage() == null ? "Erreur téléchargement" : e.getMessage());
                  }
              }

              @PluginMethod
              public void shareUri(PluginCall call) {
                  String uriString = call.getString("uri");
                  String title = call.getString("title", "STAF Transport");
                  String text = call.getString("text", "");
                  String mimeType = call.getString("mimeType", "application/octet-stream");
                  if (uriString == null || uriString.length() == 0) { call.reject("Fichier introuvable"); return; }
                  try {
                      Intent intent = new Intent(Intent.ACTION_SEND);
                      intent.setType(mimeType);
                      Uri uri = Uri.parse(uriString);
                      intent.putExtra(Intent.EXTRA_STREAM, uri);
                      intent.setClipData(ClipData.newRawUri(title, uri));
                      intent.putExtra(Intent.EXTRA_SUBJECT, title);
                      if (text != null && text.length() > 0) intent.putExtra(Intent.EXTRA_TEXT, text);
                      intent.addFlags(Intent.FLAG_GRANT_READ_URI_PERMISSION);
                      Intent chooser = Intent.createChooser(intent, "Partager");
                      chooser.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                      getContext().startActivity(chooser);
                      call.resolve();
                  } catch (Exception e) {
                      call.reject(e.getMessage() == null ? "Partage impossible" : e.getMessage());
                  }
              }

              @PluginMethod
              public void pickTextFile(PluginCall call) {
                  String mimeType = call.getString("mimeType", "application/json");
                  Intent intent = new Intent(Intent.ACTION_OPEN_DOCUMENT);
                  intent.addCategory(Intent.CATEGORY_OPENABLE);
                  intent.setType("*/*");
                  intent.putExtra(Intent.EXTRA_MIME_TYPES, new String[]{"application/json", "text/plain", "application/octet-stream", "*/*"});
                  startActivityForResult(call, intent, "pickTextFileResult");
              }

              @ActivityCallback
              private void pickTextFileResult(PluginCall call, ActivityResult result) {
                  if (call == null) return;
                  try {
                      if (result.getResultCode() != Activity.RESULT_OK || result.getData() == null || result.getData().getData() == null) {
                          call.reject("Aucun fichier sélectionné");
                          return;
                      }
                      Uri uri = result.getData().getData();
                      try (InputStream in = getContext().getContentResolver().openInputStream(uri); ByteArrayOutputStream out = new ByteArrayOutputStream()) {
                          if (in == null) throw new Exception("Fichier impossible à ouvrir");
                          byte[] buffer = new byte[8192];
                          int len;
                          while ((len = in.read(buffer)) != -1) out.write(buffer, 0, len);
                          JSObject ret = new JSObject();
                          ret.put("text", out.toString("UTF-8"));
                          ret.put("uri", uri.toString());
                          call.resolve(ret);
                      }
                  } catch (Exception e) {
                      call.reject(e.getMessage() == null ? "Lecture impossible" : e.getMessage());
                  }
              }
          }
          JAVA
          python3 - <<'PY'
          from pathlib import Path
          p = Path("android/app/src/main/java/com/sabrinos/app/MainActivity.java")
          s = p.read_text()
          if "DownloadSaverPlugin.class" not in s:
              s = s.replace("import com.getcapacitor.BridgeActivity;", "import com.getcapacitor.BridgeActivity;\nimport android.os.Bundle;")
              s = s.replace("public class MainActivity extends BridgeActivity {}", "public class MainActivity extends BridgeActivity {\n    @Override\n    public void onCreate(Bundle savedInstanceState) {\n        registerPlugin(DownloadSaverPlugin.class);\n        super.onCreate(savedInstanceState);\n    }\n}")
              p.write_text(s)
          PY

      - name: Generate Android launcher icons & splash from resources/icon.png
        run: |
          if [ -f "resources/icon.png" ]; then
            npx --yes @capacitor/assets generate --android \
              --iconBackgroundColor "#000000" \
              --iconBackgroundColorDark "#000000" \
              --splashBackgroundColor "#000000" \
              --splashBackgroundColorDark "#000000" || echo "Asset generation failed (non-fatal)"
          else
            echo "No resources/icon.png found, skipping icon generation"
          fi

      - name: Sync Capacitor (Android)
        run: npx cap sync android

      - name: Inject Android permissions (camera, micro, etc.)
        run: |
          MANIFEST=android/app/src/main/AndroidManifest.xml
          python3 - <<'PY'
          import re, pathlib
          p = pathlib.Path("android/app/src/main/AndroidManifest.xml")
          s = p.read_text()
          perms = [
              'android.permission.INTERNET',
              'android.permission.CAMERA',
              'android.permission.RECORD_AUDIO',
              'android.permission.MODIFY_AUDIO_SETTINGS',
              'android.permission.ACCESS_NETWORK_STATE',
              'android.permission.WRITE_EXTERNAL_STORAGE',
              'android.permission.READ_EXTERNAL_STORAGE',
              'android.permission.READ_MEDIA_IMAGES',
              'android.permission.POST_NOTIFICATIONS',
              'android.permission.VIBRATE',
          ]
          features = [
              ('android.hardware.camera', 'false'),
              ('android.hardware.camera.autofocus', 'false'),
              ('android.hardware.microphone', 'false'),
          ]
          block = ""
          for perm in perms:
              tag = f'<uses-permission android:name="{perm}" />'
              if perm not in s:
                  block += "    " + tag + "\n"
          for feat, req in features:
              tag = f'<uses-feature android:name="{feat}" android:required="{req}" />'
              if feat not in s:
                  block += "    " + tag + "\n"
          if block:
              s = re.sub(r'(<manifest[^>]*>\s*\n)', r'\1' + block, s, count=1)
          s = re.sub(r'<application\b(?![^>]*requestLegacyExternalStorage)', '<application android:requestLegacyExternalStorage="true"', s, count=1)
          if block or 'requestLegacyExternalStorage' in s:
              p.write_text(s)
              print("Injected permissions:\n" + block)
          else:
              print("All permissions already present")
          PY
          echo "--- Final AndroidManifest.xml ---"
          cat $MANIFEST

      - name: Grant execute permission to gradlew
        run: chmod +x android/gradlew

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Create GitHub Release (on main push)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: APK Build ${{ github.run_number }}
          files: android/app/build/outputs/apk/debug/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
